spring.application.name=backend
# Load local, uncommitted development secrets from either common launch directory.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
# PostgreSQL is the primary local-development database. Override these through
# DB_URL, DB_USERNAME, and DB_PASSWORD rather than committing credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/connectify}
spring.datasource.username=${DB_USERNAME:connectify}
spring.datasource.password=${DB_PASSWORD:connectify}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Multipart settings for profile picture/upload configs later
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# JWT Configuration
# IMPORTANT: Replace the secret with a securely generated 256-bit
# Base64-encoded random key before deploying to production.
# You can generate one with: openssl rand -base64 32
# ============================================================
