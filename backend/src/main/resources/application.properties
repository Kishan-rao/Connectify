spring.application.name=backend
# Load the root-level, uncommitted development secrets when Gradle runs from
# the backend directory.
spring.config.import=optional:file:${user.dir}/../.env[.properties]
# PostgreSQL is the primary local-development database. Override these through
# DB_URL, DB_USERNAME, and DB_PASSWORD rather than committing credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/connectify}
spring.datasource.username=${DB_USERNAME:connectify}
spring.datasource.password=${DB_PASSWORD:CONNECTIFY}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Multipart settings for profile picture/upload configs later
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# JWT Configuration
# The signing secret is read from the JWT_SECRET environment
# variable. There is no built-in fallback: the application will
# fail to start if JWT_SECRET is not set.
# Generate a suitable secret with:
#   openssl rand -base64 48
# or (PowerShell):
#   [Convert]::ToBase64String((1..48 | ForEach-Object { [byte](Get-Random -Max 256) }))
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
