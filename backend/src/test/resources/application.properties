# Keep automated tests isolated from the local PostgreSQL development database.
spring.datasource.url=jdbc:h2:mem:connectify-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Test-only JWT secret — never used for real authentication (H2 in-memory DB only).
# Must be a valid Base64-encoded key of at least 256 bits for HMAC-SHA256.
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci11bml0LWFuZC1pbnRlZ3JhdGlvbi10ZXN0cw==
app.jwt.expiration-ms=86400000
